apiVersion: v1
kind: Namespace
metadata:
  name: surfsk8s-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: surfsk8s-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: surfsk8s-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args: ["-text=ok"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: surfsk8s-smoke
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: surfsk8s-smoke
spec:
  selector:
    app: api
  ports:
    - port: 5678
      targetPort: 5678
