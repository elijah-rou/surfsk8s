name: live-k3d-e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-k3d-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SURFSK8S_E2E_CACHE: ${{ runner.temp }}/surfsk8s-e2e-cache
      SURFSK8S_E2E_ARTIFACTS: ${{ runner.temp }}/surfsk8s-e2e-artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.2
          cache: true

      - name: Install pinned kubectl
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/kubectl-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 \
            --output "$install_dir/kubectl" \
            https://dl.k8s.io/release/v1.35.1/bin/linux/amd64/kubectl
          echo '36e2f4ac66259232341dd7866952d64a958846470f6a9a6a813b9117bd965207  '"$install_dir/kubectl" | sha256sum --check
          chmod 700 "$install_dir/kubectl"
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Deterministic model and unit tests
        run: |
          command -v flock
          timeout 150s go test ./... -count=1 -shuffle=on -timeout=120s
          python3 -m unittest discover -s scripts/e2e -p 'test_*.py'

      - name: Live k3d and real-PTY suite
        run: timeout --signal=TERM --kill-after=3m 14m ./scripts/e2e/run.sh

      - name: Upload failure diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-k3d-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/surfsk8s-e2e-artifacts/**
            !${{ runner.temp }}/surfsk8s-e2e-artifacts/**/kubeconfig*
            !${{ runner.temp }}/surfsk8s-e2e-artifacts/**/*secret*
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
